<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The King — The Road to Marwa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#3a2d5c; --panel:rgba(255,247,238,.95); --panel-ink:#2b1f45; --muted:#6b5a86;
  --accent:#d9472f; --accent-ink:#fff; --gold:#f2b84b; --line:rgba(43,31,69,.25); --btn2:rgba(43,31,69,.07);
  --serif:'Cinzel','Palatino Linotype',Georgia,serif; --sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0e0a1e; --panel:rgba(30,21,54,.95); --panel-ink:#f6eeff; --muted:#bcaedb; --line:rgba(246,238,255,.25); --btn2:rgba(246,238,255,.08); }
}
:root[data-theme="dark"]{ --bg:#0e0a1e; --panel:rgba(30,21,54,.95); --panel-ink:#f6eeff; --muted:#bcaedb; --line:rgba(246,238,255,.25); --btn2:rgba(246,238,255,.08); }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
@supports(height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;color:#fff}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.portrait #stage{align-items:flex-start;padding-top:4px}
#frame{position:relative;background:#000}
#cv{display:block;width:100%;height:100%}
.hidden{display:none!important}
button{font-family:var(--sans);-webkit-appearance:none;appearance:none}

/* top buttons */
#topbtns{position:absolute;top:8px;right:8px;display:none;gap:8px;z-index:6}
body[data-state="play"] #topbtns,body[data-state="title"] #topbtns,body[data-state="intro"] #topbtns,body[data-state="ending"] #topbtns{display:flex}
#btnPause{display:none}
body[data-state="play"] #btnPause{display:flex}
.ibtn{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);background:rgba(20,12,40,.55);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ibtn svg{width:20px;height:20px}
.ibtn:active{background:rgba(217,71,47,.8)}
.ibtn:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* touch controls */
#controls{position:absolute;left:0;right:0;bottom:0;height:0;display:none;z-index:8;pointer-events:none}
body[data-state="play"] #controls{display:block}
#dpad{position:absolute;left:clamp(10px,2.5vmin,28px);bottom:clamp(10px,2.5vmin,28px);width:clamp(150px,26vmin,240px);height:clamp(74px,13vmin,120px);border-radius:999px;cursor:pointer;background:rgba(20,12,40,.42);border:2px solid rgba(255,255,255,.32);display:flex;pointer-events:auto;touch-action:none}
#dpad span{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);border-radius:999px;transition:background .06s}
#dpad svg{width:34px;height:34px}
#dpad.l span:first-child,#dpad.r span:last-child{background:rgba(242,184,75,.45)}
#acts{position:absolute;right:clamp(10px,2.5vmin,28px);bottom:clamp(10px,2.5vmin,28px);width:clamp(190px,34vmin,300px);height:clamp(130px,24vmin,210px);pointer-events:none}
.cbtn{cursor:pointer;position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.38);background:rgba(20,12,40,.45);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;padding:0}
.cbtn svg{width:38%;height:38%}
.cbtn.on{background:rgba(242,184,75,.6);border-color:#fff}
#bJump{right:0;bottom:0;width:clamp(92px,17vmin,150px);height:clamp(92px,17vmin,150px)}
#bAtk{right:calc(clamp(92px,17vmin,150px) + 12px);bottom:clamp(34px,6vmin,60px);width:clamp(76px,14vmin,124px);height:clamp(76px,14vmin,124px)}
.portrait #dpad{width:min(42vw,220px);height:min(20vw,104px);border-radius:60px;left:12px;bottom:40px}
.portrait #dpad svg{width:36px;height:36px}
.portrait #bJump{width:min(26vw,112px);height:min(26vw,112px);right:8px;bottom:36px}
.portrait #bAtk{width:min(22vw,94px);height:min(22vw,94px);right:calc(min(26vw,112px) + 14px);bottom:calc(36px + min(10vw,56px))}
#rot{position:absolute;left:0;right:0;bottom:190px;text-align:center;font:700 13px var(--sans);color:rgba(255,255,255,.7);display:none;pointer-events:none}
body.portrait.touch[data-state="play"] #rot{display:block}

/* overlay + panel */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20;pointer-events:none}
#overlay.title{justify-content:flex-end;padding-right:5%;background:linear-gradient(90deg,rgba(8,4,22,0) 35%,rgba(8,4,22,.62))}
.portrait #overlay.title{align-items:flex-end;justify-content:center;padding:12px 12px 24px;background:linear-gradient(180deg,rgba(8,4,22,0) 38%,rgba(8,4,22,.78))}
#overlay.dim{background:rgba(8,4,22,.55)}
#panel{pointer-events:auto;width:min(390px,100%);max-height:100%;overflow:auto;background:var(--panel);color:var(--panel-ink);border:2px solid var(--gold);border-radius:18px;padding:18px 20px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.5);animation:pop .22s ease-out}
#overlay.title #panel{background:none;border:0;box-shadow:none;color:#fff;width:min(340px,100%)}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(38px,11vw,58px);letter-spacing:.08em;margin:0;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(255,190,110,.55)}
h2{font-family:var(--serif);font-weight:800;font-size:22px;margin:0 0 4px;letter-spacing:.03em}
.sub{font-family:var(--serif);font-weight:600;font-size:clamp(15px,4.4vw,20px);color:var(--gold);margin:8px 0 16px;letter-spacing:.06em}
.muted{color:var(--muted);font-size:14px;line-height:1.45;margin:8px 0 0}
#overlay.title .muted{color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn{min-height:48px;padding:12px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.28);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn.alt{background:var(--btn2);color:var(--panel-ink);box-shadow:none;border:2px solid var(--line)}
#overlay.title .btn.alt{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;text-align:left;margin:12px 4px 4px;font-weight:700}
.stats b{font-family:var(--serif);color:var(--accent)}
.gem{color:#5ab8ff}
#skip{position:absolute;right:10px;bottom:10px;z-index:9;display:none;padding:10px 16px;border-radius:20px;border:1.5px solid rgba(255,255,255,.45);background:rgba(20,12,40,.6);color:#fff;font-weight:800;font-size:14px}
body[data-state="intro"] #skip,body[data-state="ending"] #skip{display:block}
body.portrait #skip{top:auto}
#overlay.title .stats b{color:var(--gold)}
@media (prefers-reduced-motion:reduce){#panel{animation:none}}
</style>
</head>
<body data-state="title">
<div id="app">
  <div id="stage"><div id="frame">
    <canvas id="cv"></canvas>
    <div id="topbtns">
      <button class="ibtn" id="btnMute" aria-label="Sound"></button>
      <button class="ibtn" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg></button>
    </div>
  </div></div>
  <div id="rot">Tip: rotate your phone for a wider view</div>
  <div id="controls">
    <div id="dpad"><span><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div id="acts">
      <button class="cbtn" id="bAtk" data-k="attack" aria-label="Attack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4L9 15"/><path d="M14 4h6v6"/><path d="M4 14l6 6"/><path d="M6 18l-2 2"/></svg></button>
      <button class="cbtn" id="bJump" data-k="jump" aria-label="Jump"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/><path d="M5 21l7-7 7 7" opacity=".5"/></svg></button>
    </div>
  </div>
  <div id="overlay" class="hidden"><div id="panel"></div></div>
  <button id="skip">Skip ›</button>
</div>
<script>
'use strict';
/* =====================================================================
   ANWAR — THE ROAD TO MARWA
   A 2D fantasy platformer. Everything is drawn procedurally on <canvas>.
   ===================================================================== */
const TS=32,ROWS=12,VH=384,TAU=Math.PI*2;
let VW=640,SC=1,DPR=1;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const hash=(a,b)=>{let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;};
const wrapX=(v,w)=>((v%w)+w)%w;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
const cv=$('#cv'),g=cv.getContext('2d'),app=$('#app'),frame=$('#frame');

function resize(){
  const r=app.getBoundingClientRect(),W=Math.max(200,r.width),H=Math.max(200,r.height);
  const portrait=H>W*1.05;
  document.body.classList.toggle('portrait',portrait);
  VW=Math.round(clamp(VH*W/H,420,760));
  SC=Math.min(W/VW,H/VH);
  DPR=Math.min(window.devicePixelRatio||1,2);
  const cw=Math.floor(VW*SC),ch=Math.floor(VH*SC);
  frame.style.width=cw+'px';frame.style.height=ch+'px';
  cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);
}

/* ---------------- input ---------------- */
const kb={left:0,right:0,jump:0,attack:0},tc={left:0,right:0,jump:0,attack:0},held={left:0,right:0,jump:0,attack:0};
let prevJump=0,prevAtk=0,jumpP=0,atkP=0;
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'attack',KeyX:'attack',KeyJ:'attack',KeyK:'attack'};
function pollInput(){
  for(const k of ['left','right','jump','attack'])held[k]=kb[k]||tc[k];
  jumpP=held.jump&&!prevJump;atkP=held.attack&&!prevAtk;prevJump=held.jump;prevAtk=held.attack;
}
function bindInput(){
  addEventListener('keydown',e=>{
    const k=KEYMAP[e.code];
    if(k){kb[k]=1;e.preventDefault();initAudio();return;}
    if(e.repeat)return;
    if(e.code==='Escape'||e.code==='KeyP'){togglePause();}
    else if(e.code==='KeyM'){setMuted(!muted);}
    else if(e.code==='Enter'){const b=document.querySelector('#overlay:not(.hidden) .btn.primary');if(b){b.click();}else if(G.state==='intro'||G.state==='ending'){cineAdvance();}}
  });
  addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){kb[k]=0;e.preventDefault();}});
  addEventListener('blur',()=>{for(const k in kb){kb[k]=0;tc[k]=0;}});
  const dp=$('#dpad');
  const upd=e=>{const r=dp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;tc.left=x<.5?1:0;tc.right=x>=.5?1:0;dp.classList.toggle('l',!!tc.left);dp.classList.toggle('r',!!tc.right);};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();try{dp.setPointerCapture(e.pointerId);}catch(_){}upd(e);initAudio();});
  dp.addEventListener('pointermove',e=>{if(dp.hasPointerCapture&&dp.hasPointerCapture(e.pointerId))upd(e);});
  const end=()=>{tc.left=0;tc.right=0;dp.classList.remove('l','r');};
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>dp.addEventListener(n,end));
  document.querySelectorAll('[data-k]').forEach(b=>{
    const k=b.dataset.k;
    b.addEventListener('pointerdown',e=>{e.preventDefault();tc[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}initAudio();});
    const off=()=>{tc[k]=0;b.classList.remove('on');};
    ['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,off));
  });
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('gesturestart',e=>e.preventDefault());
  addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});
  try{if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');}catch(_){}
}

/* ---------------- audio (all synthesized) ---------------- */
let AC=null,master=null,muted=false,noiseBuf=null,nextNote=0,mStep=0,mWorld=0,mBoss=false;
try{muted=localStorage.getItem('anwar_muted')==='1';}catch(_){}
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
    const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    nextNote=AC.currentTime+.2;setInterval(musicTick,120);
  }catch(e){AC=null;}
}
function setMuted(m){muted=m;if(master)master.gain.value=m?0:.55;try{localStorage.setItem('anwar_muted',m?'1':'0');}catch(_){}updateMuteIcon();}
function tone(f,d,type,v,slide,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  gn.gain.setValueAtTime(v||.1,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,f0,f1,delay){
  if(!AC||muted||!noiseBuf)return;
  const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),gn=AC.createGain();
  s.buffer=noiseBuf;fl.type='lowpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+d);
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(gn);gn.connect(master);s.start(t);s.stop(t+d+.05);
}
const SFX={
  jump(){tone(280,.14,'square',.08,260);},
  jump2(){tone(420,.16,'triangle',.12,500);},
  coin(){tone(988,.07,'square',.06);tone(1319,.14,'square',.06,0,.06);},
  gem(){[784,988,1175,1568].forEach((f,i)=>tone(f,.2,'triangle',.11,0,i*.07));},
  slash(){noise(.12,.16,1800,600);tone(220,.08,'sawtooth',.04,-120);},
  hit(){noise(.1,.22,900,200);tone(140,.1,'square',.09,-80);},
  kill(){tone(300,.2,'square',.08,-250);noise(.18,.18,1200,150);},
  hurt(){tone(200,.3,'sawtooth',.12,-150);noise(.2,.18,700,100);},
  power(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.06,0,i*.06));},
  key(){[659,880,1319].forEach((f,i)=>tone(f,.15,'triangle',.12,0,i*.08));},
  gate(){noise(.6,.28,300,80);tone(90,.6,'sawtooth',.09,-30);},
  check(){[523,784].forEach((f,i)=>tone(f,.2,'triangle',.11,0,i*.1));},
  stomp(){tone(160,.1,'square',.1,-60);},
  roar(){noise(.9,.32,500,60);tone(90,.9,'sawtooth',.13,-40);},
  boom(){noise(.8,.38,600,40);tone(70,.6,'sine',.22,-40);},
  shoot(){tone(500,.12,'square',.05,-300);},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.32,'triangle',.12,0,i*.12));},
  die(){[392,330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.09,0,i*.16));},
  heart(){[659,784,988].forEach((f,i)=>tone(f,.15,'sine',.14,0,i*.07));},
  zap(){tone(1200,.2,'sawtooth',.07,-1000);noise(.15,.18,3000,500);},
  tele(){tone(200,.25,'sine',.09,800);},
  step(){tone(700,.04,'triangle',.05);},
};
function sfx(n){if(!AC||muted)return;try{SFX[n]();}catch(_){}}
const SCALES=[[0,2,4,7,9],[0,3,5,7,10],[0,2,3,5,7,8,10],[0,1,4,5,7,8],[0,2,4,6,7,9,11],[0,2,3,7,8]];
const ROOTS=[52,50,45,43,47,48];
function setMusic(w,boss){mWorld=w;mBoss=!!boss;}
function osc(f,t,d,type,v){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+.02);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.05);}
function musicTick(){
  if(!AC||muted||AC.state!=='running')return;
  if(G.state==='paused'||G.state==='complete'){nextNote=Math.max(nextNote,AC.currentTime+.05);return;}
  const bpm=mBoss?132:(mWorld===2?84:98),dur=60/bpm/2;
  if(nextNote<AC.currentTime)nextNote=AC.currentTime+.05;
  while(nextNote<AC.currentTime+.35){playStep(nextNote,mStep++,dur);nextNote+=dur;}
}
function playStep(t,s,dur){
  const sc=SCALES[mWorld%6],root=ROOTS[mWorld%6]+(mBoss?-5:0),mf=n=>440*Math.pow(2,(n-69)/12);
  if(s%8===0||s%8===5)osc(mf(root-12+(Math.floor(s/8)%2?sc[2]:0)),t,dur*3.5,'triangle',.1);
  const pat=[0,2,1,3,2,4,3,1],deg=pat[s%8]+(Math.floor(s/16)%2?1:0),oct=(s%16>=8)?12:0;
  if(s%2===0||mBoss)osc(mf(root+sc[deg%sc.length]+oct),t,dur*1.6,'square',.028);
}
/* ---------------------------- LEVELS ---------------------------- */
const T={SOLID:1,ONE:2,SPIKE:3,GATE:4,LAVA:6,BLOCK:9,BARRIER:10};
function LB(name,w,theme,sub){
  const L={name,w,theme,sub,t:new Uint8Array(w*ROWS),e:[],arena:null,gates:[],spawn:{c:2,r:9}};
  const set=(c,r,v)=>{if(c>=0&&c<w&&r>=0&&r<ROWS)L.t[r*w+c]=v;};
  L.set=set;
  L.ground=(a,b,top)=>{top=top===undefined?9:top;for(let c=a;c<b;c++)for(let r=top;r<ROWS;r++)set(c,r,T.SOLID);};
  L.plat=(c,r,n)=>{for(let i=0;i<n;i++)set(c+i,r,T.ONE);};
  L.spikes=(c,n,r)=>{for(let i=0;i<n;i++)set(c+i,r===undefined?8:r,T.SPIKE);};
  L.lava=(a,b)=>{for(let c=a;c<b;c++){set(c,10,T.LAVA);set(c,11,T.LAVA);}};
  L.gate=(c,r0,r1)=>{for(let r=r0;r<=r1;r++)set(c,r,T.GATE);L.gates.push({c,r0,r1});};
  L.add=(type,c,r,o)=>{L.e.push(Object.assign({type,c,r},o||{}));};
  L.coins=(c,r,n,dx)=>{for(let i=0;i<n;i++)L.add('coin',c+i*(dx||1),r);};
  L.arc=(c,r,n,h)=>{h=h||1.5;for(let i=0;i<n;i++){const t=n>1?i/(n-1):.5;L.add('coin',c+i,r-Math.sin(t*Math.PI)*h);}};
  L.mover=(c,w,pitW,per)=>L.add('mplat',c,9,{w,range:(pitW-w)*TS,per:per||240,axis:'x'});
  L.barrier=(c)=>{for(let r=0;r<=8;r++)set(c,r,T.BARRIER);};
  return L;
}

function level1(){

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(Array.isArray(r)?r[0]:r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
}
const disc=(x,y,r,col)=>{g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();};
const ell=(x,y,rx,ry,col,rot)=>{g.fillStyle=col;g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);g.fill();};
const rect=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
const rrect=(x,y,w,h,r,col)=>{g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();};
const poly=(p,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill();};
const line=(x1,y1,x2,y2,w,col,cap)=>{g.strokeStyle=col;g.lineWidth=w;g.lineCap=cap||'round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();};
function glow(x,y,r,rgb,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${rgb},${a})`);gr.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
function tiled(cw,par,camx,fn){const off=camx*par,i0=Math.floor(off/cw)-1,i1=Math.ceil((off+VW)/cw)+1;for(let i=i0;i<=i1;i++)fn(i,i*cw-off,hash(i,cw));}
function ridge(par,camx,base,amp,col,f1,f2,ph){
  g.fillStyle=col;g.beginPath();g.moveTo(0,VH);
  for(let x=0;x<=VW+8;x+=8){const wx=x+camx*par;g.lineTo(x,base-amp*(.5+.3*Math.sin(wx*f1+ph)+.2*Math.sin(wx*f2+ph*2.3)));}
  g.lineTo(VW+8,VH);g.closePath();g.fill();
}
function pine(x,by,h,w,col){
  rect(x-2,by-h*.16,4,h*.16,col);
  for(let i=0;i<3;i++){const y1=by-h*.12-i*h*.27,ww=w*(1-i*.24);poly([x-ww,y1,x,y1-h*.42,x+ww,y1],col);}
}
function crystal(x,by,h,w,col,gl){
  poly([x-w,by,x-w*.7,by-h*.7,x,by-h,x+w*.7,by-h*.75,x+w,by],col);
  poly([x,by-h,x+w*.7,by-h*.75,x+w,by,x+w*.2,by],'rgba(255,255,255,.12)');
  if(gl)glow(x,by-h*.5,h*.9,gl,.22);
}

function stars(camx,t,par,n,ymax){
  for(let i=0;i<n;i++){const x=wrapX(hash(i,7)*900-camx*par,900)*VW/900*1.0,y=hash(i,13)*ymax;
    if(x>VW)continue;const a=.35+.5*Math.abs(Math.sin(t*1.3+i));g.fillStyle=`rgba(255,246,220,${a})`;g.fillRect(x,y,i%5?1.4:2.2,i%5?1.4:2.2);}
}
function bigMoon(x,y,r,col,rgb){glow(x,y,r*3,rgb,.28);disc(x,y,r,col);disc(x-r*.3,y-r*.2,r*.22,'rgba(0,0,0,.08)');disc(x+r*.35,y+r*.3,r*.15,'rgba(0,0,0,.07)');disc(x+r*.1,y-r*.5,r*.11,'rgba(0,0,0,.06)');}

  gr.addColorStop(0,T.sky[0]);gr.addColorStop(.45,T.sky[1]);gr.addColorStop(.78,T.sky[2]);gr.addColorStop(1,T.sky[3]);
  g.fillStyle=gr;g.fillRect(0,0,VW,VH);BG[th](T,cx,t);

/* ambient particles in screen space, by theme */
function initAmb(th){
  G.amb=[];const n=[26,34,22,42,60,30][th];
  for(let i=0;i<n;i++)G.amb.push({x:rnd(VW),y:rnd(VH),ph:rnd(TAU),s:rnd(.6,1.6),v:rnd(.5,1.2)});
}
function drawAmb(th,t,dt,dcam){
  const rgb=['255,240,140','140,255,240','170,255,190','255,150,60','190,205,255','255,235,190'][th];
  for(const p of G.amb){
    p.x-=dcam*.4*p.v;
    if(th===0){p.x+=Math.sin(t+p.ph)*.3;p.y+=Math.cos(t*.8+p.ph)*.25;}
    else if(th===1){p.y-=.15*p.v;p.x+=Math.sin(t*.6+p.ph)*.2;}
    else if(th===2){p.x+=.25*p.v+Math.sin(t*.5+p.ph)*.2;p.y+=Math.sin(t*.7+p.ph)*.2;}
    else if(th===3){p.y-=.9*p.v;p.x+=Math.sin(t*2+p.ph)*.4;}
    else if(th===4){p.y+=9*p.v;p.x-=3*p.v;}
    else {p.y+=.35*p.v;p.x+=Math.sin(t+p.ph)*.5;}
    if(p.y<-8)p.y=VH+8;if(p.y>VH+10){p.y=-8;p.x=rnd(VW);}
    if(p.x<-10)p.x=VW+10;if(p.x>VW+10)p.x=-10;
    if(th===4){line(p.x,p.y,p.x+3,p.y-11*p.v,1,'rgba(200,215,255,.35)');continue;}
    const a=.35+.45*Math.abs(Math.sin(t*1.7+p.ph));
    g.fillStyle=`rgba(${rgb},${a})`;
    if(th===5){g.fillRect(p.x,p.y,p.s*2.2,p.s*2.2);}else{g.beginPath();g.arc(p.x,p.y,p.s*(th===3?1.2:1.8),0,TAU);g.fill();}
  }
}

/* ---------------- tiles ---------------- */
const solidTile=v=>v===1||v===4||v===9||v===10;
function tileAt(c,r){const L=G.L;if(c<0||c>=L.w)return 1;if(r<0||r>=ROWS)return 0;return L.t[r*L.w+c];}
function drawTiles(L,camx,t){
  const c0=Math.max(0,Math.floor(camx/TS)-1),c1=Math.min(L.w-1,Math.ceil((camx+VW)/TS)+1),T=TH[L.theme];
  for(let c=c0;c<=c1;c++)for(let r=0;r<ROWS;r++){const v=L.t[r*L.w+c];if(v)drawTile(v,c,r,L,T,t);}
}
function drawTile(v,c,r,L,T,t){
  const x=c*TS,y=r*TS,th=L.theme,h=hash(c,r);
  if(v===1){
    let d=0;while(d<3&&solidTile(tileAt(c,r-1-d)))d++;
    rect(x,y,TS+1,TS+1,d===0?T.gr:d===1?T.gr2:T.gr3);
    if(!solidTile(tileAt(c-1,r))){rect(x,y,2,TS,'rgba(0,0,0,.28)');}
    if(!solidTile(tileAt(c+1,r))){rect(x+TS-2,y,2,TS,'rgba(0,0,0,.2)');}
    if(th===0){ // soil
      if(h>.3)ell(x+8+h*14,y+12+h*10,2.5,1.6,'rgba(255,255,255,.1)');if(h<.5)ell(x+20-h*10,y+22,2,1.4,'rgba(0,0,0,.18)');
      if(d>0&&h>.6)line(x+4,y,x+10,y+14,1.6,'rgba(0,0,0,.22)');
    }else if(th===1){
      line(x,y+10+h*6,x+TS,y+14+h*8,1.4,'rgba(0,0,0,.2)');line(x,y+24,x+TS,y+22-h*6,1,'rgba(255,255,255,.06)');
      if(d>0&&h>.82){poly([x+10,y+26,x+15,y+12,x+20,y+26],'rgba(63,214,207,.55)');glow(x+15,y+18,20,'63,214,207',.25);}
    }else if(th===2){
      g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=1.2;g.beginPath();g.moveTo(x,y+16);g.lineTo(x+TS,y+16);const o=(r%2)*16;g.moveTo(x+o+8,y);g.lineTo(x+o+8,y+16);g.moveTo(x+(16-o)+8,y+16);g.lineTo(x+(16-o)+8,y+TS);g.stroke();
      if(h>.85)line(x+6,y+4,x+14,y+13,1,'rgba(0,0,0,.3)');
    }else if(th===3){
      if(d>0&&h>.45){const f=.55+.35*Math.sin(t*2+c+r);g.strokeStyle=`rgba(255,110,40,${f})`;g.lineWidth=1.6;g.beginPath();g.moveTo(x+4,y+6+h*10);g.lineTo(x+14,y+16);g.lineTo(x+12,y+26);g.lineTo(x+26,y+30);g.stroke();}
      g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1.2;g.strokeRect(x+.5,y+.5,TS-1,TS-1);
    }else if(th===4){
      g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=1.2;g.strokeRect(x+1.5,y+1.5,TS-3,TS-3);disc(x+6,y+6,1.4,'rgba(255,255,255,.22)');disc(x+TS-6,y+6,1.4,'rgba(255,255,255,.22)');
    }else{
      g.strokeStyle='rgba(0,0,0,.26)';g.lineWidth=1.2;g.strokeRect(x+.5,y+.5,TS-1,TS-1);
      if(h>.55){g.strokeStyle='rgba(255,215,106,.35)';g.beginPath();g.moveTo(x+6,y+TS/2);g.lineTo(x+TS-6,y+TS/2);g.stroke();}
    }
    if(d===0){
      rect(x,y,TS+1,7,T.cap);rect(x,y,TS+1,2.5,T.cap2);rect(x,y+7,TS+1,2,'rgba(0,0,0,.25)');
      if(th===0){g.fillStyle=T.cap;for(let i=0;i<4;i++){const bx=x+3+i*8+h*3;g.beginPath();g.moveTo(bx,y+1);g.lineTo(bx+2,y-4-((i+c)%3)*1.5);g.lineTo(bx+4,y+1);g.fill();}}
      else if(th===1&&h>.5)poly([x+8,y,x+12,y-9,x+16,y],T.cap2);
      else if(th===3){glow(x+16,y+1,26,'255,140,50',.16);}
      else if(th===5)rect(x,y+2.5,TS,1.5,'rgba(255,215,106,.7)');
    }
  }else if(v===2){
    const l=tileAt(c-1,r)!==2,rr=tileAt(c+1,r)!==2;
    rrect(x+(l?2:-1),y+1,TS-(l?2:0)+(rr?-2:1),11,l||rr?4:1,T.pl);
    rect(x+(l?4:0),y+1,TS-(l?4:0)-(rr?4:0),2.5,T.pl2);rect(x,y+10,TS,2,'rgba(0,0,0,.28)');
    if(th===0)line(x+16,y+4,x+16,y+11,1,'rgba(0,0,0,.25)');
    if(th===1||th===5)glow(x+16,y+2,20,th===1?'122,224,230':'211,201,255',.1);
    if(th===3)glow(x+16,y+2,20,'255,140,50',.12);
  }else if(v===3){
    rect(x+2,y+TS-4,TS-4,4,'rgba(0,0,0,.35)');
    for(let i=0;i<3;i++){const bx=x+1+i*10.5;poly([bx,y+TS,bx+5,y+TS-22-(i===1?3:0),bx+10,y+TS],T.sp);poly([bx+5,y+TS-22-(i===1?3:0),bx+10,y+TS,bx+6,y+TS],'rgba(0,0,0,.22)');}
  }else if(v===6){
    const top=r===10&&tileAt(c,r-1)!==6;
    rect(x,y,TS,TS,r===10?'#ff7a1f':'#c93a10');
    if(top){g.fillStyle='#ffb040';g.beginPath();g.moveTo(x,y+TS);g.lineTo(x,y+3);for(let i=0;i<=8;i++)g.lineTo(x+i*4,y+2+3*Math.sin((x+i*4)*.11+t*3));g.lineTo(x+TS,y+TS);g.fill();rect(x,y+8,TS,TS-8,'#ff7a1f');glow(x+16,y,42,'255,130,40',.25);}
    if(h>.5)ell(x+8+h*16,y+12+Math.sin(t*2+c)*5,3,2.2,'rgba(255,220,110,.6)');
    if(r===11)rect(x,y+TS-10,TS,10,'rgba(90,10,0,.4)');
  }else if(v===4){
    const gt=L.gates.find(q=>q.c===c);let mid=gt?((gt.r0+gt.r1)>>1):-1;
    rect(x,y,TS,TS,'#2b1e1a');
    for(let i=0;i<4;i++)rect(x+3+i*7.5,y,4,TS,'#4a3428'),rect(x+3+i*7.5,y,1.4,TS,'#6b4c3a');
    rect(x,y+4,TS,4,'#8a8f9c');rect(x,y+TS-8,TS,4,'#8a8f9c');rect(x,y+4,TS,1.4,'#c5cad6');rect(x,y+TS-8,TS,1.4,'#c5cad6');
    if(r===mid||r===mid+1&&false){const k=G.hasKey?.5+.5*Math.sin(t*6):0;glow(x+16,y+TS,30,'255,215,106',.3*k+.1);rrect(x+9,y+TS-6,14,14,3,'#f2b84b');rrect(x+11,y+TS-4,10,10,2,'#c98d1e');disc(x+16,y+TS+1,2.3,'#3a2410');rect(x+15,y+TS+1,2,5,'#3a2410');g.strokeStyle='#f2b84b';g.lineWidth=2.4;g.beginPath();g.arc(x+16,y+TS-8,5,Math.PI,0);g.stroke();}
  }else if(v===10){
    const p=.55+.25*Math.sin(t*3+r*.6);
    glow(x+16,y+16,34,'190,120,255',.2);
    g.fillStyle=`rgba(150,90,230,${p*.6})`;g.fillRect(x+6,y,20,TS);
    g.fillStyle=`rgba(230,200,255,${p})`;g.fillRect(x+13,y,6,TS);
    for(let i=0;i<3;i++){const yy=(y+((t*30+i*11+r*7)%TS));g.fillStyle='rgba(255,255,255,.7)';g.fillRect(x+10+(i%2)*10,yy,2,5);}
  }
}

/* Anwar: young man, average height, slightly stocky, dark curly hair. Origin = feet centre, faces +x. */
function drawAnwar(x,y,face,s){
  const t=s.t,run=s.run||0,air=!!s.air,ph=t*12*(.35+run*.65);
  g.save();g.translate(x,y);g.scale(face*.92,.92);
  const bob=air?0:(run>.1?-Math.abs(Math.sin(ph))*1.8:Math.sin(t*2.2)*-.7);
  const tun='#c2472d',tunD='#8f3220',trs='#33385f',skin='#c98f63',skinD='#a9744b',hair='#2a1a16';
  /* back arm */
  const bs=air?-.6:Math.sin(ph+Math.PI)*.9*run;
  line(-5,-24+bob,-5+Math.sin(bs)*8,-24+bob+Math.cos(bs)*9,5.4,tunD);disc(-5+Math.sin(bs)*8,-24+bob+Math.cos(bs)*9,2.6,skinD);
  /* scarf tail (behind) */
  let px=-6,py=-26+bob;g.lineCap='round';
  for(let i=1;i<=5;i++){const nx=-6-i*4.2-run*i*1.8,ny=-26+bob+(air?(s.vy>0?-i*1.8:i*1.6):i*1.1)+Math.sin(t*9+i*.9)*(1+run*1.6);line(px,py,nx,ny,Math.max(1.8,5.6-i*.7),i%2?'#22a6a1':'#1a8a86');px=nx;py=ny;}
  /* legs */
  for(let k=0;k<2;k++){
    const a=air?(k?-.75:.55):(run>.08?Math.sin(ph+k*Math.PI)*.95:0),hx=-2.6+k*5.2;
    const lift=air?0:(run>.08?Math.max(0,Math.cos(ph+k*Math.PI))*3.2:0);
    const fx=hx+Math.sin(a)*10,fy=Math.min(0,-13+bob*.4+Math.cos(a)*13-lift);
    line(hx,-13+bob,fx,fy-2,6.2,k?trs:'#292d4d');ell(fx+1.5,fy-1,5.2,3.3,k?'#5a3a2a':'#48301f');
  }
  /* torso */
  g.fillStyle=tun;g.beginPath();g.roundRect(-8.6,-28+bob,17.2,16.5,4);g.fill();
  poly([-8.6,-14+bob,8.6,-14+bob,10,-9+bob,-10,-9+bob],tun);
  line(-6.5,-27+bob,6,-15.5+bob,2.6,'#4a2f1e');
  rect(-9,-18+bob,18,3.4,'#4a2f1e');rect(-1.6,-18.2+bob,4.2,4,'#f2b84b');
  /* scarf collar */
  rrect(-8,-31+bob,16,5.4,2.6,'#22a6a1');rrect(-8,-27.4+bob,16,1.6,.8,'#177e7a');
  /* head */
  const hy=-36.5+bob;
  rect(-2,-32+bob,6,4,skinD);
  disc(-5,hy+1.5,2.4,skinD);
  disc(1.5,hy,8,skin);
  /* curly hair */

function part(x,y,vx,vy,life,col,size,gr){G.parts.push({x,y,vx,vy,life,max:life,col,size,gr:gr===undefined?520:gr});}
function burst(x,y,n,cols,sp,life,size,gr){for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(sp*.3,sp);part(x,y,Math.cos(a)*s,Math.sin(a)*s-sp*.25,rnd(life*.6,life),cols[i%cols.length],rnd(size*.6,size),gr);}}
function ring(x,y,col){for(let i=0;i<14;i++){const a=i/14*TAU;part(x,y,Math.cos(a)*110,Math.sin(a)*110,.4,col,3,0);}}
function updParts(dt){for(const q of G.parts){q.life-=dt;q.vy+=q.gr*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}G.parts=G.parts.filter(q=>q.life>0);if(G.parts.length>400)G.parts.splice(0,G.parts.length-400);}
function drawParts(){for(const q of G.parts){g.globalAlpha=clamp(q.life/q.max,0,1);g.fillStyle=q.col;g.fillRect(q.x-q.size/2,q.y-q.size/2,q.size,q.size);}g.globalAlpha=1;}

/* ---------------- collision ---------------- */
function moveX(b,dx){
  if(!dx)return 0;const dir=dx>0?1:-1;let nx=b.x+dx;
  const edge=dir>0?nx+b.w:nx,c=Math.floor(edge/TS),r0=Math.floor((b.y+2)/TS),r1=Math.floor((b.y+b.h-2)/TS);
  for(let r=r0;r<=r1;r++)if(solidTile(tileAt(c,r))){b.x=dir>0?c*TS-b.w-.01:(c+1)*TS+.01;return dir;}
  b.x=nx;return 0;
}
function moveBody(b,dt){
  if(!b.nog)b.vy=Math.min(b.vy+GRAV*(b.gm||1)*dt,MAXFALL);
  b.hitWall=moveX(b,b.vx*dt);if(b.hitWall)b.vx=0;
  const prevB=b.y+b.h;let ny=b.y+b.vy*dt;b.on=false;b.ride=null;
  if(b.vy>=0){
    const bottom=ny+b.h,rr=Math.floor(bottom/TS),c0=Math.floor((b.x+2)/TS),c1=Math.floor((b.x+b.w-2)/TS);let land=null;
    for(let c=c0;c<=c1;c++){const v=tileAt(c,rr),top=rr*TS;if((solidTile(v)&&prevB<=top+6)||(v===2&&!b.noOne&&prevB<=top+.5)){if(land===null||top<land)land=top;}}
    if(b.plat)for(const m of G.mps){if(b.x+b.w>m.x+3&&b.x<m.x+m.w-3&&prevB<=m.y+.5&&bottom>=m.y&&(land===null||m.y<land)){land=m.y;b.ride=m;}}
    if(land!==null){ny=land-b.h;b.vy=0;b.on=true;}
  }else{
    const rr=Math.floor(ny/TS),c0=Math.floor((b.x+2)/TS),c1=Math.floor((b.x+b.w-2)/TS);
    if(ny>=0)for(let c=c0;c<=c1;c++)if(solidTile(tileAt(c,rr))){ny=(rr+1)*TS+.01;b.vy=0;break;}
  }
  b.y=ny;
}
function ledgeAhead(e){
  const c=Math.floor((e.face>0?e.x+e.w+3:e.x-3)/TS),r=Math.floor((e.y+e.h+3)/TS),v=tileAt(c,r);
  if(!(solidTile(v)||v===2))return true;
  const v2=tileAt(c,Math.floor((e.y+e.h-3)/TS));return v2===3||v2===6;
}

function respawnSafe(fx){const p=G.p;p.x=p.safe.x;p.y=p.safe.y;p.vx=0;p.vy=0;p.inv=Math.max(p.inv,1.6);if(fx){sfx('tele');burst(p.x+10,p.y+17,10,['#fff','#ffd76a'],140,.5,3,0);}}

function updEnemy(e,dt){

/* ---------------- items ---------------- */
function updItems(dt){

      if(solidTile(tileAt(Math.floor((it.x+it.vx*.02)/TS),Math.floor(it.y/TS))))it.vx=0;
      if(it.y>VH+40)it.dead=true;

    if(p.dead)continue;

        if(it.type==='check'&&!it.on){it.on=true;G.checks.add(it.idx);p.hp=Math.min(p.maxHp,p.hp+1);commitNow({x:it.x-10,y:it.y-34});sfx('check');hint('Checkpoint reached.',2.2);burst(it.x+10,it.y-38,14,['#ffd76a','#fff'],150,.8,3,100);}

    }

      if(it.type==='coin'){G.coins++;G.score+=10;sfx('coin');part(it.x,it.y,0,-60,.4,'#ffd23f',3,0);}
      else if(it.type==='moon'){G.moons++;G.score+=250;sfx('gem');burst(it.x,it.y,14,['#e6f4ff','#ffd76a'],150,.7,3,80);hint(`Moon shard ${G.moons} of ${G.moonTotal}`,2.2);}
      else if(it.type==='heart'){if(p.hp<p.maxHp)p.hp++;else G.score+=100;sfx('heart');burst(it.x,it.y,8,['#ff5a6e'],110,.5,3,0);}
      else if(it.type==='key'){G.hasKey=true;sfx('key');hint('Key found. Carry it to the gate.');burst(it.x,it.y,12,['#ffd76a'],150,.6,3,0);}
      else if(it.type==='pu')applyPU(it.k);
    }
  }
  G.items=G.items.filter(i=>!i.dead);
  /* gates */
  for(const gt of G.L.gates){if(gt.open)continue;const gx=gt.c*TS+16,gy0=gt.r0*TS,gy1=(gt.r1+1)*TS;
    const near=Math.abs(p.x+p.w/2-gx)<46&&p.y+p.h>gy0&&p.y<gy1;
    if(near&&G.hasKey)openGate(gt.c);
    else if(near&&!G.hasKey&&!(G.hint&&G.hint.text.startsWith('Locked')))hint('Locked. Find the key nearby.',2.6);}
}

/* ---------------- projectiles ---------------- */
function spawnStrike(x,warn,col){G.projs.push({kind:'strike',x:clamp(x,G.arena.xl+16,G.arena.xr-16),w:30,warn,act:0,floor:9*TS,col:col||null,seed:rint(1,99)});sfx('shoot');}
function updProjs(dt){
  const p=G.p,pcx=p.x+p.w/2;
  for(const q of G.projs){
    if(q.kind==='strike'){
      if(q.warn>0){q.warn-=dt;if(q.warn<=0){q.act=.32;sfx('zap');G.shake=Math.max(G.shake,.3);}}
      else{q.act-=dt;if(q.act<=0)q.dead=true;else if(!p.dead&&Math.abs(pcx-q.x)<q.w/2+p.w/2-4)hurtPlayer(1,q.x);}
      continue;
    }
    q.life-=dt;if(q.life<=0||q.y>VH+60){q.dead=true;continue;}
    if(q.homing&&!q.friendly){
      const a=Math.atan2(q.vy,q.vx),ta=Math.atan2(p.y+p.h/2-q.y,pcx-q.x);let d=ta-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;
      const na=a+clamp(d,-1.6*dt,1.6*dt),sp=Math.hypot(q.vx,q.vy);q.vx=Math.cos(na)*sp;q.vy=Math.sin(na)*sp;
    }
    q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(Math.random()<.5&&q.kind!=='wave')part(q.x,q.y,rnd(-20,20),rnd(-20,20),.3,q.kind==='orb'?'#c48bff':(q.friendly?'#ffb040':'#ff6a4a'),3,0);
    if(q.kind==='wave'){const dirn=q.vx>0?1:-1;if(solidTile(tileAt(Math.floor((q.x+dirn*10)/TS),Math.floor(q.y/TS)))){q.dead=true;continue;}
      if(!p.dead&&ov(pRect(p),{x:q.x-9,y:q.y-12,w:18,h:24})){hurtPlayer(1,q.x);}
      if(Math.random()<.4)part(q.x,q.y+10,rnd(-20,20),rnd(-60,-20),.35,'#c8b0f0',3,0);
      continue;}
    if(solidTile(tileAt(Math.floor(q.x/TS),Math.floor(q.y/TS)))){q.dead=true;burst(q.x,q.y,5,['#ffb040','#fff'],90,.3,3,0);continue;}
    if(q.friendly){
      for(const e of G.ents){if(!e.dead&&q.x>e.x-4&&q.x<e.x+e.w+4&&q.y>e.y-4&&q.y<e.y+e.h+4){damageEnemy(e,q.dmg||2,q.x-q.vx*.05);q.dead=true;burst(q.x,q.y,10,['#ff8a3d','#ffd76a'],160,.4,4);break;}}
      const b=G.boss;if(!q.dead&&b&&b.state!=='dying'&&q.x>b.x&&q.x<b.x+b.w&&q.y>b.y&&q.y<b.y+b.h){hurtBoss(b,q.dmg||2);q.dead=true;burst(q.x,q.y,10,['#ff8a3d','#ffd76a'],160,.4,4);}
    }else if(!p.dead&&q.x>p.x-4&&q.x<p.x+p.w+4&&q.y>p.y-4&&q.y<p.y+p.h+4){hurtPlayer(1,q.x);q.dead=true;burst(q.x,q.y,8,['#ff6a4a','#fff'],130,.3,3,0);}
  }
  G.projs=G.projs.filter(q=>!q.dead);
}

/* ---------------- moving platforms ---------------- */
function updMps(dt){for(const m of G.mps){m.t+=dt;const nx=m.x0+m.range*(.5-.5*Math.cos(TAU*m.t/m.per));m.dx=nx-m.x;m.x=nx;}}
/* ---------------------------- BOSSES & ARENA ---------------------------- */
const FLOORY=9*TS;
const BOSSD={1:{w:40,h:82,hp:10},2:{w:76,h:44,hp:12},3:{w:26,h:62,hp:12}};
const BOSSCOL={1:['#e6dfc4','#8dff6a','#f2b84b'],2:['#3d5a8a','#f2e6c0','#ffe640'],3:['#c48bff','#5a2aa0','#ff8ae8']};
const NOHURT=new Set(['enter','dying','appear','vanish','gone']);

function mkBoss(k){
  const d=BOSSD[k],A=G.arena;
  const HP=Math.round(d.hp*(A.hard?1.5:1)),b={kind:k,w:d.w,h:d.h,hp:HP,maxHp:HP,x:0,y:0,vx:0,vy:0,face:-1,on:false,state:'enter',st:0,inv:0,hitId:-1,t:0,n:0,alpha:1,mouth:0,ph:1,hits:0,volley:0,hitWall:0,harm:false,dT:0,q:[]};
  if(k===1){b.x=A.spawnC*TS;b.y=-120;}
  else if(k===2){b.x=A.xr+60;b.y=112-d.h/2;}
  else{b.x=A.spawnC*TS;b.y=FLOORY-d.h;b.alpha=0;b.state='appear';b.st=b.aT=1.6;}
  return b;
}
const bcx=b=>b.x+b.w/2, bcy=b=>b.y+b.h/2;
function faceP(b){b.face=(G.p.x+G.p.w/2)>bcx(b)?1:-1;}
function wave(x,dir,sp){G.projs.push({kind:'wave',friendly:false,x,y:FLOORY-12,vx:dir*(sp||175),vy:0,life:2.8});}

function hurtBoss(b,dmg){
  if(b.inv>0||NOHURT.has(b.state))return;
  b.hp-=dmg;b.inv=.32;G.score+=40;sfx('hit');G.shake=Math.max(G.shake,.18);
  burst(bcx(b),bcy(b),10,BOSSCOL[b.kind],200,.5,4);
  if(b.hp<=0){bossDie(b);return;}
  if(b.kind===3){b.hits++;if(b.hits%2===0&&(b.state==='idle'||b.state==='cast'||b.state==='after')){b.state='vanish';b.st=.4;b.q=[];sfx('tele');}}
}
function bossDie(b){
  b.state='dying';b.dT=0;b.hp=0;b.vx=0;b.vy=0;b.q=[];b.harm=false;b.nog=false;
  G.projs=G.projs.filter(q=>q.friendly);G.shake=.9;G.white=.7;sfx('boom');setMusic(G.L.theme,false);
}
function finishBoss(b){
  const A=G.arena,L=G.L,cx=bcx(b),cy=bcy(b);
  G.boss=null;A.state='won';G.white=1;G.score+=1500;sfx('win');
  burst(cx,cy,40,BOSSCOL[b.kind],320,1.1,6);
  for(let i=0;i<8;i++)G.items.push({type:'coin',drop:1,x:cx,y:cy,vx:rnd(-160,160),vy:rnd(-380,-200),life:0,ph:rnd(TAU),idx:undefined});
  for(let r=0;r<=8;r++)L.set(A.c0,r,0);
  if(G.marwa){
    const bc=A.rightC;for(let r=0;r<=8;r++){L.set(bc,r,0);for(let i=0;i<3;i++)part(bc*TS+16,r*TS+16,rnd(-90,90),rnd(-120,20),1,'#d3c9ff',rnd(3,6));}
    hint('The barrier falls. Marwa is waiting.',6);
    commitNow({x:(A.rightC-3)*TS,y:FLOORY-34});
  }else{
    G.items.push({type:'heart',x:cx,y:FLOORY-40,idx:undefined,ph:0});
    G.items.push({type:'exit',x:(L.w-5+.5)*TS,y:FLOORY,idx:-1,ph:0});
    hint(BOSSNAMES[b.kind]+' is defeated. The way is open.',5);
    commitNow({x:(L.w-9)*TS,y:FLOORY-34});
  }
}

function updArena(dt){
  const A=G.arena;if(!A)return;const p=G.p;
  if(A.state==='idle'){
    if(!p.dead&&p.x>A.trig*TS){
      A.state='fight';
      for(let r=0;r<=8;r++)G.L.set(A.c0,r,T.BARRIER);
      G.boss=mkBoss(A.boss);G.bossT=0;setMusic(G.L.theme,true);sfx('roar');G.shake=.3;
      commitNow({x:(A.c0+2)*TS,y:FLOORY-34});
    }
  }
  if(G.boss){G.bossT+=dt;updBoss(G.boss,dt);}
}

function updBoss(b,dt){
  const p=G.p;
  b.t+=dt;if(b.inv>0)b.inv-=dt;
  if(b.state==='dying'){
    b.dT+=dt;G.shake=Math.max(G.shake,.25);
    if(Math.random()<.6)burst(b.x+rnd(b.w),b.y+rnd(b.h),5,BOSSCOL[b.kind],160,.6,4,200);
    if(b.kind===2){b.vx=0;moveBody(b,dt);}
    if(b.dT>2.6)finishBoss(b);
    return;
  }
  if(b.hp<=b.maxHp/2&&b.ph===1){b.ph=2;sfx('roar');G.shake=.5;ring(bcx(b),bcy(b),'#ffd76a');burst(bcx(b),bcy(b),16,BOSSCOL[b.kind],240,.7,4);}
  const pcx=p.x+p.w/2,pcy=p.y+p.h/2;
  if(b.kind===1)updGrim(b,dt,pcx,pcy);else if(b.kind===2)updVyr(b,dt,pcx,pcy);else updMal(b,dt,pcx,pcy);
  if(b.harm&&!p.dead&&ov(pRect(p),{x:b.x+4,y:b.y+6,w:b.w-8,h:b.h-8}))hurtPlayer(1,bcx(b));
}

/* ---- Grimtusk: ground bruiser. Walk, cleave, charge (stuns on wall), slam in phase 2 ---- */
function updGrim(b,dt,pcx,pcy){
  const cx=bcx(b),dx=pcx-cx,adx=Math.abs(dx),ph2=b.ph===2;b.harm=false;
  switch(b.state){
   case 'enter':
    b.vx=0;moveBody(b,dt);
    if(b.on&&!b.landed){b.landed=1;b.st=1.3;G.shake=.7;sfx('roar');burst(cx,b.y+b.h,16,['#d8d0c0','#8a7a6a'],220,.6,4,300);}
    if(b.landed){b.st-=dt;faceP(b);if(b.st<=0){b.state='walk';b.st=1.1;}}
    break;
   case 'walk':
    faceP(b);b.vx=b.face*(ph2?80:58);b.harm=true;b.st-=dt;
    if(b.st<=0){
      b.n++;b.vx=0;
      if(adx<105){b.state='wind';b.st=ph2?.4:.55;}
      else if(ph2&&b.n%3===0){b.state='jump';b.jt=0;b.vy=-560;b.vx=b.face*70;sfx('jump2');}
      else{b.state='cwind';b.st=.7;}
    }
    moveBody(b,dt);break;
   case 'wind':
    b.vx=0;b.st-=dt;if(b.st<=0){b.state='swing';b.st=.28;sfx('slash');}
    moveBody(b,dt);break;
   case 'swing':{
    b.vx=0;b.st-=dt;
    const r={x:b.face>0?cx+2:cx-68,y:b.y+8,w:66,h:b.h-12};
    if(!G.p.dead&&ov(pRect(G.p),r))hurtPlayer(1,cx);
    if(b.st<=0){b.state='recover';b.st=.95;}
    moveBody(b,dt);break;}
   case 'recover':
    b.vx=0;b.st-=dt;if(b.st<=0){b.state='walk';b.st=rnd(1,1.6);}
    moveBody(b,dt);break;
   case 'cwind':
    b.vx=0;b.st-=dt;if(b.st>.3)faceP(b);
    if(b.st<=0){b.state='charge';b.st=1.2;sfx('roar');}
    moveBody(b,dt);break;
   case 'charge':
    b.vx=b.face*(ph2?275:230);b.harm=true;b.st-=dt;
    moveBody(b,dt);
    if(Math.random()<.5)part(cx-b.face*14,b.y+b.h-3,rnd(-40,40),rnd(-60,-10),.4,'#d8d0c0',4,200);
    if(b.hitWall){b.state='stun';b.st=1.9;b.vx=0;G.shake=.6;sfx('boom');burst(cx+b.face*20,b.y+b.h*.5,14,['#d8d0c0','#8a7a6a'],220,.6,4);}
    else if(b.st<=0){b.state='recover';b.st=.8;b.vx=0;}
    break;
   case 'stun':
    b.vx=0;b.st-=dt;if(b.st<=0){b.state='recover';b.st=.6;}
    moveBody(b,dt);break;
   case 'jump':
    b.harm=true;b.jt+=dt;moveBody(b,dt);
    if(b.on&&b.jt>.2){b.vx=0;b.state='slam';b.st=.55;G.shake=.7;sfx('boom');wave(cx+30,1,190);wave(cx-30,-1,190);burst(cx,b.y+b.h,14,['#d8d0c0','#8a7a6a'],240,.6,4,300);}
    break;
   case 'slam':
    b.vx=0;b.st-=dt;if(b.st<=0){b.state='recover';b.st=.9;}
    moveBody(b,dt);break;
  }
}

/* ---- Vyrmara: flying drake. Fire volleys, lightning storm, dive-bomb then rests grounded ---- */
function updVyr(b,dt,pcx,pcy){
  const A=G.arena,cx=bcx(b),cy=bcy(b),ph2=b.ph===2,xmin=A.xl+70,xmax=A.xr-70;b.harm=false;b.mouth=0;
  const setC=(x,y)=>{b.x=x-b.w/2;b.y=y-b.h/2;};
  const glide=(tx,ty,k)=>{const f=Math.min(1,dt*k);setC(cx+(tx-cx)*f,cy+(ty-cy)*f);};
  switch(b.state){
   case 'enter':
    b.face=-1;b.st+=dt;glide((A.xl+A.xr)/2,120,2.4);
    if(b.st>1.7){b.state='hover';b.st=1.1;b.volley=0;sfx('roar');G.shake=.45;}
    break;
   case 'hover':{
    b.harm=true;faceP(b);
    glide(clamp(pcx+Math.sin(b.t*.8)*170,xmin,xmax),112+Math.sin(b.t*1.7)*14,1.7);
    b.st-=dt;if(b.st<.4&&b.st>0)b.mouth=1;
    if(b.st<=0){
      const sx=cx+b.face*56,sy=cy-14,a0=Math.atan2(pcy-sy,pcx-sx),sp=ph2?215:180;
      for(const o of (ph2?[-.3,0,.3]:[0]))G.projs.push({kind:'fire',friendly:false,x:sx,y:sy,vx:Math.cos(a0+o)*sp,vy:Math.sin(a0+o)*sp,life:3});
      sfx('shoot');b.volley++;b.st=ph2?1.15:1.6;
      if(b.volley>=(ph2?2:3)){b.volley=0;b.n++;if(b.n%2===0){b.state='dwind';b.st=.6;}else{b.state='storm';b.st=.7;b.sn=0;}}
    }
    break;}
   case 'storm':
    b.harm=true;faceP(b);b.mouth=1;glide((A.xl+A.xr)/2+Math.sin(b.t)*60,105,1.5);
    b.st-=dt;
    if(b.st<=0){
      if(b.sn<(ph2?4:3)){spawnStrike(pcx+rnd(-26,26),.85);b.sn++;b.st=.62;}
      else{b.state='hover';b.st=1.3;b.volley=0;}
    }
    break;
   case 'dwind':
    b.harm=true;faceP(b);glide(clamp(pcx,xmin,xmax),64,3);G.shake=Math.max(G.shake,.06);
    b.st-=dt;
    if(b.st<=0){b.state='dive';b.tx=pcx;b.ty=FLOORY-25;b.face=b.tx>cx?1:-1;sfx('roar');}
    break;
   case 'dive':{
    b.harm=true;const a=Math.atan2(b.ty-cy,b.tx-cx),sp=ph2?480:420;
    setC(cx+Math.cos(a)*sp*dt,cy+Math.sin(a)*sp*dt);
    if(cy+Math.sin(a)*sp*dt>=b.ty-4||Math.hypot(b.tx-cx,b.ty-cy)<12){
      setC(clamp(cx,A.xl+40,A.xr-40),b.ty);b.state='land';b.st=.35;b.harm=false;G.shake=.7;sfx('boom');
      wave(bcx(b)+46,1,185);wave(bcx(b)-46,-1,185);burst(bcx(b),b.y+b.h,18,['#d8d0c0','#a9c0f0'],240,.6,4,300);
    }
    break;}
   case 'land':
    b.st-=dt;if(b.st<=0){b.state='rest';b.st=ph2?2.3:2.9;}
    break;
   case 'rest':
    faceP(b);b.st-=dt;if(Math.random()<.15)part(bcx(b)+rnd(-20,20),b.y-4,rnd(-10,10),rnd(-40,-10),.6,'#a9c0f0',3,-40);
    if(b.st<=0){b.state='lift';b.st=.7;}
    break;
   case 'lift':
    glide(clamp(cx,xmin,xmax),112,4);b.st-=dt;
    if(b.st<=0){b.state='hover';b.st=1;b.volley=0;}
    break;
  }
}

/* ---- Malachar: teleporting sorcerer. Homing orbs, lightning, ground waves ---- */
function updMal(b,dt,pcx,pcy){
  const A=G.arena,cx=bcx(b),ph2=b.ph===2;b.harm=false;faceP(b);
  for(const e of b.q){e.t-=dt;if(e.t<=0&&!e.done){e.done=1;if(e.k==='strike')spawnStrike(pcx+rnd(-14,14),.9,'190,110,255');else if(e.k==='wave'){wave(cx+e.d*22,e.d,ph2?215:190);sfx('zap');}}}
  b.q=b.q.filter(e=>!e.done);
  switch(b.state){
   case 'appear':
    b.st-=dt;b.alpha=clamp(1-b.st/b.aT,0,1);
    if(b.st<=0){b.alpha=1;b.state='idle';b.st=ph2?.55:.9;if(!b.seen){b.seen=1;G.shake=.4;sfx('roar');}}
    break;
   case 'idle':
    b.harm=true;b.st-=dt;if(b.st<=0){b.state='cast';b.st=ph2?.5:.75;sfx('zap');}
    break;
   case 'cast':
    b.harm=true;b.st-=dt;
    if(b.st<=0){malAttack(b,pcx,pcy);b.state='after';b.st=ph2?.55:.75;}
    break;
   case 'after':
    b.harm=true;b.st-=dt;if(b.st<=0){b.state='vanish';b.st=.4;sfx('tele');}
    break;
   case 'vanish':
    b.st-=dt;b.alpha=clamp(b.st/.4,0,1);
    if(b.st<=0){b.alpha=0;b.state='gone';b.st=.45;burst(cx,b.y+b.h/2,12,BOSSCOL[3],160,.6,4,0);}
    break;
   case 'gone':{
    b.alpha=0;b.st-=dt;
    if(b.st<=0){
      const lo=A.xl+50,hi=A.xr-50;let nx=rnd(lo,hi);
      if(Math.abs(nx-pcx)<130)nx=pcx>(lo+hi)/2?rnd(lo,Math.max(lo,pcx-140)):rnd(Math.min(hi,pcx+140),hi);
      b.x=clamp(nx,lo,hi)-b.w/2;b.y=FLOORY-b.h;b.state='appear';b.st=b.aT=.5;sfx('tele');
    }
    break;}
  }
}
function malAttack(b,pcx,pcy){
  const ph2=b.ph===2,k=(b.n++)%3,sx=bcx(b)+b.face*22,sy=b.y+b.h-64;
  if(k===0){
    const n=ph2?4:3,a0=Math.atan2(pcy-sy,pcx-sx);
    for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.36;G.projs.push({kind:'orb',friendly:false,homing:!ph2||i%2===0,x:sx,y:sy,vx:Math.cos(a)*118,vy:Math.sin(a)*118,life:4.2});}
    sfx('shoot');
  }else if(k===1){
    const n=ph2?4:3;for(let i=0;i<n;i++)b.q.push({t:i*.5,k:'strike'});
  }else{
    b.q.push({t:0,k:'wave',d:b.face});if(ph2)b.q.push({t:.05,k:'wave',d:-b.face});
    b.q.push({t:.9,k:'wave',d:b.face});
  }
}
/* ---------------------------- MAIN: SCREENS, CINEMATICS, LOOP ---------------------------- */
const SANS="Nunito,system-ui,-apple-system,'Segoe UI',sans-serif",SERIF="Cinzel,'Palatino Linotype',Georgia,serif";
const LNAMES=LEVELS.map(f=>f().name);
const titleL=(()=>{const L=LB('Title',140,5,'');L.ground(0,140);return L;})();
G.tot={coins:0,moons:0,moonAll:0,kills:0,deaths:0,time:0};
try{G.unlocked=clamp(parseInt(localStorage.getItem('anwar_unlocked')||'0',10)||0,0,LEVELS.length-1);}catch(_){G.unlocked=0;}
function saveProgress(){try{localStorage.setItem('anwar_unlocked',String(G.unlocked));}catch(_){}}
const fmtT=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

/* ---------------- text helpers ---------------- */
function txt(s,x,y,o){
  o=o||{};g.font=(o.i?'italic ':'')+(o.w||800)+' '+(o.s||14)+'px '+(o.f||SANS);g.textAlign=o.a||'left';g.textBaseline='alphabetic';
  if(o.stroke!==false){g.lineWidth=o.sw||3;g.strokeStyle=o.sc||'rgba(10,5,25,.85)';g.lineJoin='round';g.strokeText(s,x,y);}
  g.fillStyle=o.c||'#fff';g.fillText(s,x,y);
}
function wrap(s,maxW,o){
  g.font=(o.i?'italic ':'')+(o.w||800)+' '+(o.s||14)+'px '+(o.f||SANS);
  const words=s.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}

/* ---------------- camera ---------------- */
function updCam(dt,snap){
  const L=G.L,p=G.p,A=G.arena;let lo=0,hi=Math.max(0,L.w*TS-VW);
  if(A&&A.state==='fight'){const w=A.camR-A.camL;if(w<=VW)lo=hi=(A.camL+A.camR)/2-VW/2;else{lo=A.camL;hi=A.camR-VW;}}
  let tx=p.x+p.w/2-VW/2+p.face*38;
  if(G.state==='ending'&&G.marwa)tx=(p.x+G.marwa.x)/2-VW/2;
  tx=clamp(tx,lo,hi);
  G.cam.x=snap?tx:G.cam.x+(tx-G.cam.x)*(1-Math.exp(-6*dt));
  G.cam.x=clamp(G.cam.x,Math.min(0,lo),Math.max(0,L.w*TS-VW));
}

/* ---------------- simulation step ---------------- */
function envUpdate(dt){
  if(G.hint){G.hint.t-=dt;if(G.hint.t<=0)G.hint=null;}
  if(G.banner>0)G.banner-=dt;
  G.shake=Math.max(0,G.shake-dt*1.6);G.white=Math.max(0,G.white-dt*1.1);
  if(G.fadeIn>0)G.fadeIn-=dt;
  if(G.L.theme===4){G.flashT-=dt;if(G.flashT<=0){G.flash=1;G.boltSeed=rint(1,999);G.flashT=rnd(3,8);}if(G.flash>0)G.flash=Math.max(0,G.flash-dt*2.2);}
}
function stepPlay(dt){
  const p=G.p;
  if(p!==G._lp){G._lp=p;G.fadeIn=.5;}
  updMps(dt);updatePlayer(dt);
  if(G.p!==p)return;
  updArena(dt);
  const pc=p.x+p.w/2;
  for(const e of G.ents){if(e.dead)continue;if(Math.abs(e.x+e.w/2-pc)>VW+140&&e.kind!=='spider')continue;updEnemy(e,dt);}
  G.ents=G.ents.filter(e=>!e.dead);
  updItems(dt);updProjs(dt);updParts(dt);
  G.lvTime+=dt;envUpdate(dt);updCam(dt);
  if(p.boots>0&&Math.random()<.5&&p.on&&Math.abs(p.vx)>40)part(p.x+p.w/2-p.face*8,p.y+p.h-3,-p.face*30,rnd(-30,-5),.35,'#ffd76a',3,0);
  if(G.marwa&&G.arena&&G.arena.state==='won'&&!p.dead&&p.x>G.arena.xr-150)startEnding();
}
function step(dt){
  G.time+=dt;pollInput();
  switch(G.state){
    case 'play':stepPlay(dt);break;
    case 'complete':{
      G.winT+=dt;G.p.anim+=dt;updParts(dt);envUpdate(dt);updCam(dt);
      if(Math.random()<.2)part(G.p.x+rnd(-30,50),G.p.y-rnd(0,40),rnd(-20,20),rnd(-80,-30),1.1,['#ffd76a','#fff','#7ff0ff'][rint(0,2)],rnd(2,4),40);
      if(G.winT>1.1&&OVL.classList.contains('hidden'))showComplete();
      break;}
    case 'ending':stepEnd(dt);envUpdate(dt);updCam(dt);break;
    case 'intro':{
      const I=G.intro;I.t+=dt;G.cam.x+=52*dt;G.p.anim+=dt;
      if(I.t>6.2)cineAdvance();
      break;}
    case 'title':G.p.anim+=dt;break;
  }
}

/* ---------------- drawing ---------------- */
function drawMP(m,T){

}
function anwarState(p){

  if(G.banner>0&&G.state==='play'&&!G.boss){const a=clamp(Math.min((4-G.banner)/.5,G.banner/.9),0,1);g.globalAlpha=a;
    txt(G.L.name,VW/2,132,{s:30,a:'center',f:SERIF,w:800,c:'#ffd76a',sw:5});txt(G.L.sub,VW/2,156,{s:15,a:'center',i:1,w:700,c:'#f6eaff'});
    txt('Level '+(G.li+1),VW/2,110,{s:13,a:'center',w:800,c:'#cbb8ff'});g.globalAlpha=1;}
}
function drawOverlays(T_){
  const vg=g.createRadialGradient(VW/2,VH/2,VH*.45,VW/2,VH/2,VW*.62);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(6,2,20,.34)');g.fillStyle=vg;g.fillRect(0,0,VW,VH);
  if(G.dawn>0){
    const d=G.dawn;g.fillStyle=`rgba(255,214,150,${.15*d})`;g.fillRect(0,0,VW,VH);
    g.globalCompositeOperation='lighter';const rg=g.createRadialGradient(VW/2,VH*.72,10,VW/2,VH*.72,VW*.6);rg.addColorStop(0,`rgba(255,210,130,${.55*d})`);rg.addColorStop(1,'rgba(255,150,80,0)');g.fillStyle=rg;g.fillRect(0,0,VW,VH);g.globalCompositeOperation='source-over';
  }
  if(G.white>0){g.fillStyle=`rgba(255,255,255,${clamp(G.white,0,1)*.8})`;g.fillRect(0,0,VW,VH);}
  const p=G.p;
  if(G.state==='play'&&p&&p.dead){const a=clamp((p.dT-.9)/.7,0,1);if(a>0){g.fillStyle=`rgba(6,2,16,${a})`;g.fillRect(0,0,VW,VH);}}
  if(G.fadeIn>0){g.fillStyle=`rgba(6,2,16,${clamp(G.fadeIn/.5,0,1)})`;g.fillRect(0,0,VW,VH);}
}
let prevCam=0;
function render(dt){
  g.setTransform(cv.width/VW,0,0,cv.height/VH,0,0);
  const T_=G.time,L=G.L,th=L.theme,cam=G.cam.x;
  let zoom=1;
  if(G.state==='ending'&&G.end&&G.marwa){
    zoom=1+.8*ease(clamp((G.end.t-1)/5,0,1));
    if(zoom>1){const w=(zoom-1)/.8,cxs=(G.p.x+G.p.w/2+G.marwa.x)/2-cam,fy=FLOORY-24,tx=lerp(cxs,VW/2,w);g.save();g.translate(tx,fy);g.scale(zoom,zoom);g.translate(-cxs,-fy);}
  }
  drawBG(th,cam,T_);
  if(G.state==='title'||G.state==='intro'){
    const cx=G.state==='title'?VW*(document.body.classList.contains('portrait')?.5:.3):cam+VW*.34;
    g.save();g.translate(-cam,0);drawTiles(L,cam,T_);
    const P=G.p;
    if(G.state==='title')drawAnwar(cx,FLOORY,1,{t:P.anim,run:0,air:false,vy:0,hurt:false,atk:-1,flame:false,sheath:false});
    else drawAnwar(cx,FLOORY,1,{t:P.anim,run:.55,air:false,vy:0,hurt:false,atk:-1,flame:false,sheath:false});
    g.restore();
    drawAmb(th,T_,dt,cam-prevCam);
    drawOverlays(T_);
    if(G.state==='intro'){const I=G.intro,a=clamp(Math.min(I.t/.7,(6.2-I.t)/.7),0,1);caption(INTRO[I.i],a,VH-118);
      for(let i=0;i<INTRO.length;i++)disc(VW/2-(INTRO.length-1)*8+i*16,VH-22,3,i===I.i?'#ffd76a':'rgba(255,255,255,.35)');}
  }else{
    drawWorld(T_,dt);
    if(zoom>1)g.restore();
    drawAmb(th,T_,dt,cam-prevCam);
    drawOverlays(T_);
    if(G.state==='ending'){
      const E=G.end;
      if(E&&!E.done)for(const c of ENDCAP){if(E.t>=c[0]&&E.t<=c[1]){const a=clamp(Math.min((E.t-c[0])/.5,(c[1]-E.t)/.5),0,1);caption(c[2],a,112);}}
    }else if(G.state==='play'||G.state==='paused'||G.state==='complete')drawHUD(T_);
  }
  prevCam=cam;
}

/* ---------------- loop ---------------- */
let lastTs=0,acc=0;
function frameLoop(ts){
  requestAnimationFrame(frameLoop);
  const dt=Math.min(.1,(ts-lastTs)/1000||0);lastTs=ts;acc+=dt;
  let n=0;while(acc>=STEP&&n<5){step(STEP);acc-=STEP;n++;}if(n>=5)acc=0;
  render(dt);
}
function boot(){
  resize();addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,150));
  bindInput();updateMuteIcon();
  try{document.fonts.load('800 20px Cinzel');document.fonts.load('800 16px Nunito');}catch(_){}
  showTitle();requestAnimationFrame(frameLoop);
}
boot();
</script>
</body>
